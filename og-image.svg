<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&amp;family=Geist:wght@300;400&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- Top rule -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#f5f3ee" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Bottom rule -->
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#f5f3ee" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Label — mono style -->
  <text x="80" y="148" font-family="'Geist Mono', 'Courier New', monospace" font-size="13" fill="#f5f3ee" fill-opacity="0.55" letter-spacing="3">PRIVATE · UK FOUNDERS · APPLICATION ONLY</text>

  <!-- Main wordmark -->
  <text x="80" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="148" font-weight="400" fill="#f5f3ee" letter-spacing="-4">101<tspan font-style="italic" fill-opacity="0.7">%</tspan></text>

  <!-- Club -->
  <text x="84" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" font-weight="400" fill="#f5f3ee" fill-opacity="0.55" letter-spacing="-1">club</text>

  <!-- Divider -->
  <line x1="80" y1="430" x2="280" y2="430" stroke="#f5f3ee" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Tagline -->
  <text x="80" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#f5f3ee" fill-opacity="0.72" letter-spacing="-0.5">A private club for the 1% extra that compounds.</text>

  <!-- Domain -->
  <text x="80" y="522" font-family="'Geist Mono', 'Courier New', monospace" font-size="14" fill="#f5f3ee" fill-opacity="0.4" letter-spacing="2">101CLUB.IT.COM</text>
</svg>
